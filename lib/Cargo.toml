[package]
name = "misah"
# One number for the workspace; see the root Cargo.toml.
version.workspace = true
authors = ["mauroalberti <alberti.m65@gmail.com>"]
description = "A crate for structural geology processings."
license = "GPL-3.0-or-later"
# A copy of the root LICENSE, not a link to it: cargo packages this directory
# and nothing above it, so the SPDX expression above would have travelled to
# crates.io without the text it names. The same reason pylib carries its own.
readme = "../README.md"
repository = "https://gitlab.com/mauroalberti/misah"
exclude = [
    "test.*",
    "examples/*.svg"
]
keywords = ["earth-sciences", "structural-geology"]
categories = ["science"]
edition = "2021"

[dependencies]
ndarray = "0.15.4"
# Not optional, and not behind a feature. A feature would buy the choice of
# building without it, at the cost of two code paths through the only functions
# in the crate expensive enough to be worth reading twice -- and since the
# parallel pass returns bit-for-bit what the sequential one did, there is
# nothing a caller could want the sequential path *for*. Where the thread count
# is itself the problem, as in a plugin that must leave its host responsive,
# rayon's own `ThreadPoolBuilder::install` is the answer and needs nothing from
# here.
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

[lib]
name = "misah"
path = "src/lib.rs"

