[package]
# Not `misah`: the core crate in ../lib already claims that name, and two
# packages cannot share one within a workspace. Only the Python distribution is
# called misah, and that name lives in pyproject.toml, not here.
name = "misah-py"
# One number for the workspace; see the root Cargo.toml. maturin reads it from
# here and normalizes it to PEP 440, so 0.2.0-alpha.1 is published as 0.2.0a1.
version.workspace = true
authors = ["mauroalberti <alberti.m65@gmail.com>"]
description = "Python bindings for misah, a crate for structural geology processings."
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["earth-sciences", "structural-geology"]
categories = ["science"]
edition = "2021"
repository = "https://gitlab.com/mauroalberti/misah"

[features]
default = ["extension-module"]
# extension-module deliberately leaves libpython unlinked, which a test binary
# cannot do. Turn it off to run `cargo test --workspace`.
extension-module = ["pyo3/extension-module"]

[dependencies]
misah = { path = "../lib/" }
ndarray = "0.15.1"
numpy = "0.29"
# abi3-py39 yields a single wheel valid for every Python from 3.9 on, which is
# what makes the extension installable beside a QGIS interpreter we do not pick.
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[lib]
# The extension ships as misah._misah, private because callers reach its
# contents through the aliases misah/__init__.py sets up. The leading underscore
# is what keeps `import misah` unambiguous once the package and the compiled
# module would otherwise share a name.
name = "_misah"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
