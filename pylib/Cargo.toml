[package]
name = "mispy"
version = "0.2.0-alpha.0"
authors = ["mauroalberti <alberti.m65@gmail.com>"]
keywords = ["earth-sciences", "structural-geology"]
categories = ["science"]
edition = "2018"
repository = "https://gitlab.com/mauroalberti/misah"

[dependencies]
misah = { path = "../lib/" }
ndarray = "0.15.1"
pyo3 = { version = "0.13.2", features = ["extension-module"] }

[lib]
name = "mispy"
path = "src/lib.rs"
crate-type = ["cdylib"]